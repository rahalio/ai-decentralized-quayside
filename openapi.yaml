openapi: 3.0.3
info:
  title: Quayside
  version: 0.1.0
  description: >-
    Vertical ai-data marketplace operator plane: in-situ listings, class-aware pricing,
    entitled consumption, modular capabilities, and TCR governance.
  x-product-slug: ai-decentralized-quayside
  x-source: ai-in-decentralized+ai/openminedOcean Protocol Reference Marketplace Framework/
servers:
  - url: https://api.example.com
tags:
  - name: Marketplaces
    description: Vertical marketplace configuration and programmes
  - name: AssetListings
    description: In-situ exposed assets and pricing
  - name: Entitlements
    description: Purchased access grants and consumption gates
  - name: CapabilityModules
    description: Composable ingest/process/persist/integrate providers
  - name: RegistryEntries
    description: Token-curated semantic and provider registries
  - name: Settlements
    description: GMV, fees, royalties, and statements
paths:
  /v1/marketplaces:
    get:
      operationId: listMarketplaces
      tags: [Marketplaces]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeMarketplace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createMarketplace
      tags: [Marketplaces]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeMarketplace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/marketplaces/{marketplaceId}:
    parameters: [{ $ref: "#/components/parameters/MarketplaceId" }]
    get:
      operationId: getMarketplace
      tags: [Marketplaces]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeMarketplace" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/marketplaces/{marketplaceId}/programmes:
    parameters: [{ $ref: "#/components/parameters/MarketplaceId" }]
    post:
      operationId: createVerticalProgramme
      tags: [Marketplaces]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerticalProgrammeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeVerticalProgramme" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/asset-listings:
    get:
      operationId: listAssetListings
      tags: [AssetListings]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: marketplaceId
          in: query
          schema: { type: string }
        - name: dataClass
          in: query
          schema:
            type: string
            enum: [proprietary, regulated, commons]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeAssetListing" }
    post:
      operationId: exposeAssetListing
      tags: [AssetListings]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetListingCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeAssetListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/asset-listings/{listingId}:
    parameters: [{ $ref: "#/components/parameters/ListingId" }]
    get:
      operationId: getAssetListing
      tags: [AssetListings]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeAssetListing" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/asset-listings/{listingId}/price-schemes:
    parameters: [{ $ref: "#/components/parameters/ListingId" }]
    put:
      operationId: setListingPriceScheme
      tags: [AssetListings]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceScheme" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeAssetListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/asset-listings/{listingId}/mashups:
    parameters: [{ $ref: "#/components/parameters/ListingId" }]
    post:
      operationId: publishMashupFromListing
      tags: [AssetListings]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MashupCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeAssetListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/entitlements:
    get:
      operationId: listEntitlements
      tags: [Entitlements]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeEntitlement" }
    post:
      operationId: purchaseEntitlement
      tags: [Entitlements]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntitlementPurchase" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeEntitlement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/entitlements/{entitlementId}:
    parameters: [{ $ref: "#/components/parameters/EntitlementId" }]
    get:
      operationId: getEntitlement
      tags: [Entitlements]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeEntitlement" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/entitlements/{entitlementId}/revoke:
    parameters: [{ $ref: "#/components/parameters/EntitlementId" }]
    post:
      operationId: revokeEntitlement
      tags: [Entitlements]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeEntitlement" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/capability-modules:
    get:
      operationId: listCapabilityModules
      tags: [CapabilityModules]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: marketplaceId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeCapabilityModule" }
    post:
      operationId: registerCapabilityModule
      tags: [CapabilityModules]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityModuleCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeCapabilityModule" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/capability-modules/{moduleId}:
    parameters: [{ $ref: "#/components/parameters/ModuleId" }]
    get:
      operationId: getCapabilityModule
      tags: [CapabilityModules]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeCapabilityModule" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/marketplaces/{marketplaceId}/capability-graph:
    parameters: [{ $ref: "#/components/parameters/MarketplaceId" }]
    put:
      operationId: setMarketplaceCapabilityGraph
      tags: [CapabilityModules]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityGraphUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeMarketplace" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/registry-entries:
    get:
      operationId: listRegistryEntries
      tags: [RegistryEntries]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: registryType
          in: query
          schema:
            type: string
            enum: [semanticDictionary, capabilityProvider]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeRegistryEntry" }
    post:
      operationId: submitRegistryEntry
      tags: [RegistryEntries]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryEntryCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeRegistryEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/registry-entries/{entryId}/stake:
    parameters: [{ $ref: "#/components/parameters/EntryId" }]
    post:
      operationId: stakeOnRegistryEntry
      tags: [RegistryEntries]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StakeCreate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeRegistryEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/registry-entries/{entryId}/challenges:
    parameters: [{ $ref: "#/components/parameters/EntryId" }]
    post:
      operationId: challengeRegistryEntry
      tags: [RegistryEntries]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChallengeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/settlements/statements:
    get:
      operationId: listSettlementStatements
      tags: [Settlements]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: marketplaceId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeSettlementStatement" }
    post:
      operationId: generateSettlementStatement
      tags: [Settlements]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementStatementCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeSettlementStatement" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/settlements/statements/{statementId}:
    parameters: [{ $ref: "#/components/parameters/StatementId" }]
    get:
      operationId: getSettlementStatement
      tags: [Settlements]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeSettlementStatement" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/settlements/sla-penalties:
    get:
      operationId: listSlaPenalties
      tags: [Settlements]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeSlaPenalty" }
    post:
      operationId: recordSlaPenalty
      tags: [Settlements]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaPenaltyCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeSlaPenalty" }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    MarketplaceId:
      name: marketplaceId
      in: path
      required: true
      schema: { type: string }
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string }
    EntitlementId:
      name: entitlementId
      in: path
      required: true
      schema: { type: string }
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema: { type: string }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string }
    StatementId:
      name: statementId
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Marketplace:
      type: object
      required: [id, name, domain, kycMode, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        domain:
          type: string
          enum: [mobility, financialServices, healthcare, consumerRetail, builtEnvironment, utilities, crossDomain]
        kycMode:
          type: string
          enum: [required, optional, permissionless]
        takeRateBps: { type: integer, minimum: 0, maximum: 10000 }
        status:
          type: string
          enum: [draft, live, paused]
        capabilityGraph:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
    MarketplaceCreate:
      type: object
      required: [name, domain, kycMode]
      properties:
        name: { type: string }
        domain:
          type: string
          enum: [mobility, financialServices, healthcare, consumerRetail, builtEnvironment, utilities, crossDomain]
        kycMode:
          type: string
          enum: [required, optional, permissionless]
        takeRateBps: { type: integer, minimum: 0, maximum: 10000 }
    VerticalProgramme:
      type: object
      required: [id, marketplaceId, theme, status]
      properties:
        id: { type: string }
        marketplaceId: { type: string }
        theme: { type: string }
        sprintLabel: { type: string }
        regulatorObserverIds:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [planned, active, closed]
    VerticalProgrammeCreate:
      type: object
      required: [theme]
      properties:
        theme: { type: string }
        sprintLabel: { type: string }
        regulatorObserverIds:
          type: array
          items: { type: string }
    AssetListing:
      type: object
      required: [id, marketplaceId, title, dataClass, hostingMode, status]
      properties:
        id: { type: string }
        marketplaceId: { type: string }
        title: { type: string }
        dataClass:
          type: string
          enum: [proprietary, regulated, commons]
        hostingMode:
          type: string
          enum: [inSitu, networkHosted]
        consumptionModes:
          type: array
          items:
            type: string
            enum: [download, api, dashboard, computeToData]
        priceScheme: { $ref: "#/components/schemas/PriceScheme" }
        backgroundIpListingIds:
          type: array
          items: { type: string }
        connectorId: { type: string }
        status:
          type: string
          enum: [draft, exposed, suspended]
    AssetListingCreate:
      type: object
      required: [marketplaceId, title, dataClass, hostingMode, consumptionModes]
      properties:
        marketplaceId: { type: string }
        title: { type: string }
        dataClass:
          type: string
          enum: [proprietary, regulated, commons]
        hostingMode:
          type: string
          enum: [inSitu, networkHosted]
        consumptionModes:
          type: array
          items:
            type: string
            enum: [download, api, dashboard, computeToData]
        connectorId: { type: string }
        priceScheme: { $ref: "#/components/schemas/PriceScheme" }
    PriceScheme:
      type: object
      required: [schemeType]
      properties:
        schemeType:
          type: string
          enum: [free, exchange, fixed, auction, royalty]
        fixedPrice:
          type: object
          properties:
            amount: { type: string }
            currency: { type: string }
        royaltyBps: { type: integer, minimum: 0, maximum: 10000 }
        auctionEndsAt: { type: string, format: date-time }
    MashupCreate:
      type: object
      required: [title, sourceListingIds]
      properties:
        title: { type: string }
        sourceListingIds:
          type: array
          minItems: 1
          items: { type: string }
        royaltyBps: { type: integer, minimum: 0, maximum: 10000 }
    Entitlement:
      type: object
      required: [id, listingId, buyerId, consumptionMode, status, createdAt]
      properties:
        id: { type: string }
        listingId: { type: string }
        buyerId: { type: string }
        consumptionMode:
          type: string
          enum: [download, api, dashboard, computeToData]
        status:
          type: string
          enum: [pending, active, revoked, failed]
        referralId: { type: string }
        createdAt: { type: string, format: date-time }
    EntitlementPurchase:
      type: object
      required: [listingId, consumptionMode]
      properties:
        listingId: { type: string }
        consumptionMode:
          type: string
          enum: [download, api, dashboard, computeToData]
        referralId: { type: string }
        maxPrice:
          type: object
          properties:
            amount: { type: string }
            currency: { type: string }
    CapabilityModule:
      type: object
      required: [id, name, capability, providerId, status]
      properties:
        id: { type: string }
        name: { type: string }
        capability:
          type: string
          enum: [ingestion, processing, persistence, integration, governance]
        providerId: { type: string }
        slaTier: { type: string }
        status:
          type: string
          enum: [registered, approved, suspended]
    CapabilityModuleCreate:
      type: object
      required: [name, capability, providerId]
      properties:
        name: { type: string }
        capability:
          type: string
          enum: [ingestion, processing, persistence, integration, governance]
        providerId: { type: string }
        slaTier: { type: string }
    CapabilityGraphUpdate:
      type: object
      required: [bindings]
      properties:
        bindings:
          type: object
          additionalProperties: { type: string }
          description: Map of capability name to module id
    RegistryEntry:
      type: object
      required: [id, registryType, title, stakeTotal, status]
      properties:
        id: { type: string }
        registryType:
          type: string
          enum: [semanticDictionary, capabilityProvider]
        title: { type: string }
        description: { type: string }
        stakeTotal: { type: string }
        rank: { type: integer }
        status:
          type: string
          enum: [proposed, listed, challenged, removed]
    RegistryEntryCreate:
      type: object
      required: [registryType, title, initialStake]
      properties:
        registryType:
          type: string
          enum: [semanticDictionary, capabilityProvider]
        title: { type: string }
        description: { type: string }
        initialStake: { type: string }
    StakeCreate:
      type: object
      required: [amount]
      properties:
        amount: { type: string }
    Challenge:
      type: object
      required: [id, entryId, reason, status, createdAt]
      properties:
        id: { type: string }
        entryId: { type: string }
        reason: { type: string }
        status:
          type: string
          enum: [open, upheld, rejected]
        createdAt: { type: string, format: date-time }
    ChallengeCreate:
      type: object
      required: [reason, bond]
      properties:
        reason: { type: string }
        bond: { type: string }
    SettlementStatement:
      type: object
      required: [id, marketplaceId, periodStart, periodEnd, gmv, status]
      properties:
        id: { type: string }
        marketplaceId: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        gmv: { type: string }
        takeRateFees: { type: string }
        royaltyPayouts: { type: string }
        commonsIncentiveEvents: { type: integer }
        conversionSpread: { type: string }
        status:
          type: string
          enum: [draft, final]
    SettlementStatementCreate:
      type: object
      required: [marketplaceId, periodStart, periodEnd]
      properties:
        marketplaceId: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
    SlaPenalty:
      type: object
      required: [id, moduleId, reason, amount, createdAt]
      properties:
        id: { type: string }
        moduleId: { type: string }
        reason: { type: string }
        amount: { type: string }
        createdAt: { type: string, format: date-time }
    SlaPenaltyCreate:
      type: object
      required: [moduleId, reason, amount]
      properties:
        moduleId: { type: string }
        reason: { type: string }
        amount: { type: string }
    DataEnvelopeMarketplace:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Marketplace" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeVerticalProgramme:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/VerticalProgramme" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeAssetListing:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AssetListing" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
